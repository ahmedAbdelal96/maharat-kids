<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="catBgGrad" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" fill="url(#catBgGrad)" />

  <!-- Subtle Neutral Geometric Forms -->
  <rect x="180" y="120" width="440" height="360" rx="28" stroke="#334155" stroke-width="1.5" opacity="0.4" stroke-dasharray="6 6" />
  <circle cx="400" cy="300" r="160" stroke="#334155" stroke-width="1.5" opacity="0.3" />

  <!-- Neutral Layered Collection Symbol -->
  <g transform="translate(400, 300)">
    <!-- Back card -->
    <rect x="-60" y="-70" width="120" height="120" rx="16" fill="#334155" transform="rotate(-6)" opacity="0.6" />
    <!-- Front card -->
    <rect x="-60" y="-70" width="120" height="120" rx="16" fill="#475569" stroke="#64748b" stroke-width="1.5" transform="rotate(4)" />
    <!-- Center glyph -->
    <g transform="rotate(4)">
      <rect x="-24" y="-24" width="48" height="48" rx="8" fill="#ffffff" fill-opacity="0.1" />
      <path d="M-12 4 L-4 -4 L4 4 L12 -6" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
    </g>
  </g>
</svg>
